# Stages 1 to 3 of #41: build, package and test verification. Every push to main
# and every pull request runs the consistency checks that need no SDK at all,
# compiles the face for one product per deviceFamily, exports the store bundle --
# which builds every product manifest.xml names -- and runs the unit test suite in
# the simulator under a virtual display.
#
# All of it for both editions, Lite and Premium (#135): the build and test jobs run
# once per edition, selected by the Makefile's EDITION, so the matrix is the only
# place the two are told apart. The Lite leg of the build also proves the Lite
# invariant -- that the Premium-only files leave the Lite release build byte for
# byte what it was. release.yml stays Lite-only until a Premium release is wanted.
#
# Why a container rather than a plain runner. The SDK is a public, unauthenticated
# download -- developer.garmin.com/downloads/connect-iq/sdks/sdks.json lists every
# build, and the Linux archive needs no licence click to fetch. The device
# definitions monkeyc compiles against are a different matter: they are not in
# that archive, and the SDK manager pulls them from monkeynet.garmin.com behind a
# Garmin account sign-in, one product at a time. There is no headless fetch, so
# the definitions have to arrive some other way. ghcr.io/matco/connectiq-tester
# carries both: its 9.2.0 image was checked against manifest.xml and has a
# definition for all 51 products this face supports.
#
# The image is pinned to a release tag, not to `latest`. An SDK bump is then a
# visible one-line change with a green run behind it rather than something that
# happens to this repository overnight. (The Makefile deliberately does NOT pin
# the SDK -- it follows whatever the SDK manager has selected -- but a local
# developer chooses that; CI does not.)
#
# No developer key is involved. A signed build proves nothing a throwaway key
# does not, `monkeyc` accepts any key, and the real one is the identity every
# published app is signed with: it does not belong in a public repository's
# secrets, where every future workflow change could reach it. Stage 4, release
# automation, is where a real key first earns its place.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: consistency checks
    runs-on: ubuntu-latest
    steps:
      # lfs: true, and not only for tidiness. Several binaries here are LFS
      # objects -- the launcher icon fallback and both source typefaces among
      # them -- and a checkout without it leaves a 129-byte pointer file where
      # the .png should be. check-icons reads that file's dimensions out of its
      # header and fails; monkeyc, worse, compiles the pointer as a drawable
      # without a word. Found the first time this workflow ran.
      #
      # Pinned to a commit SHA, with the release it was published as trailing,
      # for the reason the container image below is pinned by digest: a tag like
      # v7 is a mutable pointer, and a retarget upstream would change the code CI
      # runs with no diff here to show it. Nothing secret is reachable from this
      # workflow, so the cost would be a wrong CI result rather than a stolen
      # identity -- but a red run turned green is the failure this project guards
      # against most carefully (#23). release.yml pins the same SHA; bump the two
      # together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      # Both targets are pure Python and read only what is committed, so they run
      # on a bare runner in seconds. check-icons cross-checks its mapping against
      # the SDK's device definitions when they are present and reports a SKIP when
      # they are not, which is the case here.
      - name: Fonts
        run: make check-fonts

      - name: Launcher icons
        run: make check-icons

      # manifest-premium.xml duplicates manifest.xml's product list; this fails the
      # moment the two drift (#135).
      - name: Edition manifests
        run: make check-manifests

  build:
    name: build (${{ matrix.edition }})
    runs-on: ubuntu-latest
    # fail-fast off, so a Premium failure does not cancel the Lite leg -- which is
    # the one carrying the Lite invariant -- and the reverse.
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, premium]
    container:
      # Pinned by digest, not by tag. v2.10.0 is what this digest was published
      # as, and the two agreed when it was verified -- but a registry tag is
      # mutable, so a retag upstream would swap the whole build environment, and
      # the code CI executes, without a diff here to show it. The digest cannot
      # be moved. Bump both together, deliberately, and re-check that the image
      # still defines every product in manifest.xml; #105 is where the wider
      # question of depending on this image at all is being settled.
      image: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105  # v2.10.0
    steps:
      # The image is ubuntu:jammy plus the SDK, so it carries none of these as a
      # matter of its own design. make is how the build is spelled everywhere
      # else in this project -- calling monkeyc directly here would be a second
      # copy of the build flags, free to drift from the Makefile's. git lets
      # actions/checkout clone rather than fall back to a tarball download, and
      # git-lfs is what makes its lfs: true below do anything: without it
      # checkout fails outright with "Unable to locate executable file:
      # git-lfs". The hosted runner the checks job uses carries all of them.
      #
      # python3 is named even though it is already there: it arrives as a
      # transitive dependency of the simulator's GTK stack rather than because
      # anyone chose it, so an upstream slimming of the image would take
      # tools/ci-devices.py with it and the failure would look like a broken
      # script. Naming it costs nothing and makes the dependency ours.
      - name: Install make, git, git-lfs and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make git git-lfs python3

      # lfs: true, and the SHA pin, for the reasons given in the checks job above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      # See the note at the top: a throwaway key, generated per run, never stored.
      - name: Generate a throwaway signing key
        run: |
          openssl genrsa -out /tmp/ci_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/ci_key.pem -out /tmp/ci_key -nocrypt

      # HOME, explicitly, because the image put the device definitions in root's
      # home -- /root/.Garmin/ConnectIQ/Devices -- while a container job runs with
      # HOME=/github/home. Both monkeyc and tools/ci-devices.py find the
      # definitions by expanding ~, so without this neither looks in the one place
      # they exist.
      #
      # The device set is resolved into a variable first, and the job's bash runs
      # under -e, so a failure to resolve it stops the step. It used to be read
      # straight into the loop from a process substitution, where the script's
      # exit status is discarded: the step then read an empty list, built nothing,
      # and reported success. Same shape of mistake as #23 -- a green result that
      # means the check never ran is worse than a red one.
      #
      # Past that, every family is built even after one fails, so a run reports
      # all the damage rather than the first of it. A `make` in an `if` condition
      # is exempt from -e, which is what lets the status be accumulated.
      - name: Build one product per device family
        shell: bash
        env:
          HOME: /root
        run: |
          devices=$(python3 tools/ci-devices.py)
          test -n "$devices" || { echo "::error::no device families resolved"; exit 1; }
          echo "Building $(echo "$devices" | wc -l) families:"
          echo "$devices"

          mkdir -p bin
          status=0
          while read -r family device; do
            echo "::group::$family -- $device"
            if make build EDITION=${{ matrix.edition }} \
                          DEVICE="$device" \
                          SDK_BIN=/connectiq/bin \
                          DEV_KEY=/tmp/ci_key \
                          OUTPUT="bin/$device.prg"; then
              ls -l "bin/$device.prg"
            else
              echo "::error::build failed for $device ($family)"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$devices"
          exit $status

      # Stage 2 of #41. This is a different check from the one above rather than a
      # larger one: `monkeyc -e` builds EVERY product manifest.xml names, not one
      # per family, and it fails if any single one of them lacks a device
      # definition. Until now the only thing that ever built the whole list was a
      # release being cut, which is precisely how #37 was found -- at the worst
      # moment, on the last step before an upload.
      #
      # Driven through `make export`, like every other build here, so CI and a
      # developer's own export are one command with one set of flags rather than
      # two spellings free to drift apart. HOME for the device definitions, for the
      # reason given on the step above.
      #
      # Deliberately no `if:` clause. A failure in the per-family build fails here
      # too, on the same cause and with fifty products' worth of output after it,
      # so the default -- skip once an earlier step has failed -- is the behaviour
      # that reports the fault once.
      - name: Export the store bundle
        shell: bash
        env:
          HOME: /root
        run: |
          make export EDITION=${{ matrix.edition }} SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key
          ls -l export/*.iq

      # The Lite invariant (#135). Lite is frozen, and Premium is built from the same
      # tree, so the one thing a Premium change must never do is alter Lite. This
      # builds Lite as a release PRG for one product per family, once from the
      # checkout and once from a copy with every Premium-only file deleted, and
      # fails if any pair differs. Release builds, because a debug build embeds the
      # build path and would differ regardless (#35).
      #
      # On the Lite leg only: it is a statement about Lite, and running it twice
      # would prove the same thing twice. HOME for the device definitions, as above.
      - name: Check the Lite invariant
        if: matrix.edition == 'lite'
        shell: bash
        env:
          HOME: /root
        run: |
          devices=$(python3 tools/ci-devices.py | cut -d' ' -f2 | tr '\n' ' ')
          test -n "$devices" || { echo "::error::no device families resolved"; exit 1; }
          make check-lite DEVICES="$devices" SDK_BIN=/connectiq/bin DEV_KEY=/tmp/ci_key

  test:
    name: unit tests (${{ matrix.edition }})
    runs-on: ubuntu-latest
    # One job per edition rather than two runs in one job: a second monkeydo session
    # against a simulator the first still holds hangs (see timeout-minutes below), so
    # each suite gets a simulator and a virtual display of its own. The edition tests
    # in source/tests/EditionTest.mc fail if either build carries the other's code.
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, premium]
    # Stage 3 of #41. #41 called the simulator "the real wall": monkeydo pushes a
    # .prg into a *running* simulator, and the simulator is a GUI application. The
    # container had already climbed most of it -- the image carries xvfb because
    # its own entrypoint runs the simulator under one -- but a container job
    # replaces that entrypoint with its own command, so the display is this
    # workflow's to start.
    #
    # Separate from build rather than a step inside it. The two prove different
    # things and fail for different reasons, so a red here should not be read as a
    # compile failure; they run in parallel, and #104 -- extracting the shared
    # parts into a reusable workflow -- has a cleaner seam to cut along.
    #
    # timeout-minutes because a hung monkeydo is this job's characteristic failure:
    # a second session started against a simulator the first still holds produces
    # no output and never returns, and GitHub's default would let that burn six
    # hours before anyone heard about it. The suite needs a small fraction of this.
    timeout-minutes: 15
    container:
      # The same digest the build job pins, for the same reasons; see the note
      # there. Bump both together.
      image: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105  # v2.10.0
    steps:
      # make, git and git-lfs for the reasons the build job gives. Two more here:
      #
      #   - netcat, which ubuntu:jammy does not carry. "make sim" probes port 1234
      #     until the simulator accepts connections and gives up, with advice,
      #     after sixty. That is a deterministic wait where upstream's tester.sh
      #     sleeps a flat five seconds, so the dependency is worth installing
      #     rather than trading the probe away for a sleep;
      #   - xauth, which xvfb only Recommends and --no-install-recommends
      #     therefore skips. xvfb-run is a shell script and exits non-zero without
      #     it. xvfb itself is already in the image; naming it makes the
      #     dependency ours rather than a side effect of how the image was built.
      - name: Install make, git, git-lfs, netcat and xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make git git-lfs netcat-openbsd xvfb xauth

      # lfs: true, and the SHA pin, for the reasons given in the checks job above.
      # The typefaces are LFS objects, and the test build compiles the same
      # resources the app does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      # monkeyc signs the test build like any other, so this job needs a key too.
      - name: Generate a throwaway signing key
        run: |
          openssl genrsa -out /tmp/ci_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/ci_key.pem -out /tmp/ci_key -nocrypt

      # xvfb-run -a starts an X server on the first free display, runs the command
      # against it and tears it down afterwards. The whole of "make test" goes
      # inside it, not just monkeydo: the target depends on "sim", so the simulator
      # is started within the same invocation and has to see the same DISPLAY.
      #
      # DEVICE is named rather than left to the Makefile's default, which is a
      # developer's convenience and free to change; CI should not follow it
      # silently. Which product it is does not matter -- the suite tests logic, not
      # layout -- so this is one of the products the build job already compiles.
      #
      # HOME for the device definitions, as in the build job.
      #
      # What "make test" reports on is the anchored "^PASSED (" line, not
      # monkeydo's exit status, which is 1 whether every test passed or one failed
      # (#23). Do not "simplify" this into trusting the status.
      - name: Run the unit tests
        shell: bash
        timeout-minutes: 10
        env:
          HOME: /root
        run: |
          xvfb-run -a make test EDITION=${{ matrix.edition }} \
                                DEVICE=epix2pro47mm \
                                SDK_BIN=/connectiq/bin \
                                DEV_KEY=/tmp/ci_key
